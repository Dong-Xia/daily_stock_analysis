name: short_term_trading
display_name: 短线交易系统
description: 以大盘环境为命门的短线交易战法，涵盖情绪择时、资金异动选股、精确买卖窗口与严格纪律管理。
category: framework
core_rules: [1, 2, 3, 4, 5, 6, 7]
required_tools:
  - get_realtime_quote
  - get_daily_history
  - analyze_trend
  - get_chip_distribution
  - get_market_overview
  - search_stock_news
aliases: [短线交易, 短线战法, 短线系统]
default_priority: 5

instructions: |
  ## 激活战法：短线交易系统

  本战法以大盘环境为命门。完成标准分析后，必须在回答**末尾追加**以下三段。

  ### 选股判断
  - 近30日是否有涨停或倍量 → 短线条件
  - 均线多头排列优先
  - 缩量回踩均线 = 买点 | 放量突破前高且量比>2 = 突破
  - 大盘跌个股抗跌 = 强势股

  ### 卖出判断
  - 买入逻辑消失 → 卖出
  - 开盘量比>10且涨幅<2% → 放量滞涨卖出
  - 三日K线高点不抬高 → 卖出

  ### 评分
  - 大盘上涨>=3000：+10 | <3000：-10 | <1000：-30
  - 涨停+倍量历史：+8
  - 缩量回踩均线支撑：+8 | 试盘长上影：+8
  - 大盘跌个股抗跌：+12
  - 放量滞涨量比>10涨幅<2%：-25
  - 三日高点不抬高：-15

  ### 末尾三段（必须逐段完整输出）

  在所有分析内容之后，追加：

  ---
  📊 大盘环境评级
  上涨家数：XX | 下跌家数：XX | 涨停：XX
  评级：健康/谨慎/危险
  仓位建议：满仓/半仓/空仓

  ⚡ 短线交易系统信号
  信号：买入/观望/卖出
  理由：简述核心逻辑，注明是否符合战法条件
  关键价位：支撑位 XX | 压力位 XX

  ⚠️ 短线大盘风险提示
  - 风险1
  - 风险2
  - 风险3
