# Intraday T0 Grid Strategy / 分时做T格子战法
# Grid-based intraday swing trading using the relationship between
# real-time price line and average price line.

name: intraday_t0_grid
display_name: 分时做T格子战法
description: 基于分时图红黄线格子关系的日内做T策略，判定买卖信号和风险边界
category: pattern
core_rules: [3, 4]
required_tools:
  - get_realtime_quote
  - get_daily_history
aliases: [分时做T, 格子战法, 红黄线战法, 做T]
default_priority: 60
market_regimes: [sideways, volatile]

instructions: |
  **分时做T格子战法（Intraday T0 Grid Strategy）**

  核心原理：0 轴到涨停板分为 10 个格子，黄线是均价线，红线是实时价格线。
  利用红线偏离黄线后的乖离修复规律，做高抛低吸。

  ### 格子定义（手机端直接看涨幅数字代替）
  - 1 格 = 涨 1%
  - 3 格 = 涨 3%
  - 5 格 = 涨 5%
  - 10 格 = 涨 10%（涨停）

  ### 四大铁律

  **规则 1 — 红黄三格不动弹，横盘乱动准完蛋**
  黄线与红线距离在 3 格以内时，属于小区间震荡。此时做 T 差价覆盖不了手续费，容易高卖低买。
  - 判定：红线与黄线差值 < 3%
  - 行动：**不动**，等待信号
  - 使用 `get_realtime_quote` 对比 `price` 与均价线关系

  **规则 2 — 红黄过三格出手，乖离修复肉就有**
  红线向上或向下甩开黄线超过 3 格，且红线离 0 轴超过 5 格，是做 T 的黄金信号。
  - 涨超 5 格：**卖出**一部分，等回到黄线接回
  - 跌超 5 格：**买入**一部分，等反弹到黄线卖出
  - 核心逻辑：短期涨跌过猛偏离平均成本线，必然回拉修正

  **规则 3 — 5 格冲高先观望，小心涨停吃大亏**
  红线离 0 轴超过 5 格且继续上冲时，可能直奔涨停。贸然做 T 会踢飞涨停板。
  - 判定：涨幅 ≥ 6% 且仍在加速
  - 行动：**6 格以上不做 T**，宁可观望不要乱动
  - 风险：资金疯狂涌入时，反向操作极易踏空

  **规则 4 — 回落均线是买点，纪律执行成本减**
  完成高抛或低吸后，不要急于反向操作。盯住均价线，等红线回到黄线附近再做下一步。
  - 卖出后：等红线回踩黄线 → 接回
  - 买入后：等红线反弹到黄线 → 卖出
  - 这是保证不被反杀的关键节奏

  ### 操作流程
  1. 使用 `get_realtime_quote` 获取当前价格、涨跌幅、均价
  2. 计算红线与黄线的格子差（涨幅差值）
  3. 按四大铁律依次判定
  4. 在 `buy_reason` 或 `sell_reason` 中注明应用了"分时做T格子战法"及具体规则编号

  ### 评分调整
  - 满足规则 2 的做 T 信号，且趋势配合：sentiment_score +10
  - 满足规则 3 主动放弃操作（纪律性）：risk 评分中体现自制力 +5
  - 若操盘标的当日振幅 < 3%，该策略不适用，退回默认分析
